<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#05070d">
  <title>Le Registre</title>
  <meta name="description" content="Une enquête d'une nuit dans un quartier d'affaires, pour comprendre la blockchain sans prérequis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Inter:wght@400;500&family=Newsreader:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/src/recit/recit.css">
</head>
<body>
  <canvas id="scene" aria-label="Un quartier d'affaires de nuit, vu depuis la tour Meridian"></canvas>
  <div id="stage-ui">
    <div id="fade"></div>
    <p id="loading">Chargement de la ville…</p>
    <p id="slug" aria-live="polite"><b></b><span></span></p>
    <aside id="term" aria-live="polite"><small></small><strong></strong><p></p></aside>
    <p id="line" aria-live="polite"><b></b><span></span></p>
    <section id="lab" class="lab" aria-label="Modifier le bloc">
      <h2>À vous : modifiez le bloc</h2>
      <p class="lab-hint">Clique aussi sur une couche du bloc pour savoir à quoi elle sert.</p>
      <label for="lab-data">Données</label>
      <input id="lab-data" type="text" value="Alice → Bob : 5 jetons" spellcheck="false" autocomplete="off">
      <label for="lab-nonce">Nonce</label>
      <input id="lab-nonce" type="number" value="48211" min="0" step="1">
      <p class="lab-out-label">Hash du bloc, recalculé pour de vrai (SHA-256)</p>
      <output id="lab-hash" for="lab-data lab-nonce"></output>
      <p id="lab-note" aria-live="polite">Remplace 5 par 6 et regarde le hash.</p>
    </section>
    <div id="title-card">
      <h1>Le Registre</h1>
      <p>Prologue · Suite à 03 h 05 : la structure d’un bloc</p>
    </div>
    <p id="hint">Fais défiler pour commencer</p>
    <nav id="chain-nav" aria-label="Séquences"></nav>
    <div id="progress"><i></i></div>
  </div>
  <div id="track" aria-hidden="true"></div>
  <script type="module" src="/src/recit/main.js"></script>
</body>
</html>
